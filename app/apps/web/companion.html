<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Record — Dokkabi</title>
    <style>
      /* The restricted shell ships no theme bootstrap and reads no storage:
         the isolated partition owns nothing, and the resolved theme/tokens
         arrive with the first relayed snapshot. These literals only hold the
         paint until React mounts. */
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      html:not(.dark) body {
        background: #ffffff;
        color: #262626;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/companion/main.tsx"></script>
  </body>
</html>
